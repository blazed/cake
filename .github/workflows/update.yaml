name: Nix Autoupdater

on:
  workflow_dispatch: {}
  schedule:
  - cron: '17 22 * * *'

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: DeterminateSystems/nix-installer-action@v23
      with:
        extra-conf: |
          accept-flake-config = true
    - name: Run the Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Update flake inputs
      id: flake
      run: |
        nix shell nixpkgs#git -c git config user.name 'Boberg'
        nix shell nixpkgs#git -c git config user.email '1823919+blazed@users.noreply.github.com'
        nix shell nixpkgs#jq -c bash scripts/update-flake.sh
        nix shell nixpkgs#git -c git add flake.lock
        nix shell nixpkgs#git -c git diff --cached --quiet || nix shell nixpkgs#git -c git commit -m "chore(flake): update inputs"
    - name: Update llama-swap and llama.cpp
      run: |
        nix shell nixpkgs#curl nixpkgs#jq nixpkgs#git nixpkgs#nix-update -c bash scripts/update-ai.sh
        nix shell nixpkgs#git -c git add packages
        nix shell nixpkgs#git -c git diff --cached --quiet || nix shell nixpkgs#git -c git commit -m "chore(ai): update llama-swap and llama.cpp"

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      id: cpr
      with:
        token: ${{ secrets.GH_ACCESS_TOKEN }}
        commit-message: 'chore: update packages'
        committer: Boberg <1823919+blazed@users.noreply.github.com>
        author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        signoff: false
        branch: package-auto-updates
        delete-branch: true
        title: 'chore: update packages'
        body: >-
          ${{ steps.flake.outputs.held && format('Held back, update fails verification - `{0}`', steps.flake.outputs.held) || '' }}
        labels: |
          packages
        assignees: blazed

    - name: Enable Pull Request Automerge
      if: steps.cpr.outputs.pull-request-operation == 'created'
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        token: ${{ secrets.GH_ACCESS_TOKEN }}
        pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
        merge-method: rebase

    # The PR above still lands the inputs that verify. Fail the run so the
    # held-back ones are noticed instead of going stale silently.
    - name: Report held-back inputs
      if: steps.flake.outputs.held != ''
      env:
        HELD: ${{ steps.flake.outputs.held }}
      run: |
        echo "::error::Held back (update fails verification): $HELD"
        exit 1
